<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsItDown — Website Status Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            overflow: hidden;
            color: #e5e7eb;
            padding: 1rem;
        }
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(99,102,241,.35), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236,72,153,.25), transparent 50%),
                radial-gradient(circle at 60% 10%, rgba(34,211,238,.2), transparent 50%);
            animation: drift 18s ease-in-out infinite alternate;
        }
        @keyframes drift { from { transform: scale(1); } to { transform: scale(1.15); } }
        .card {
            width: min(92vw, 480px);
            background: rgba(20,20,35,.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            background: linear-gradient(90deg,#818cf8,#e879f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p.sub {
            color: #9ca3af;
            font-size: .9rem;
            margin-bottom: 24px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            color: #f9fafb;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,.2);
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg,#6366f1,#a855f7);
            color: white;
            font-weight: 600;
            font-size: .95rem;
            transition: transform .15s, opacity .15s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .result {
            margin-top: 24px;
            display: none;
        }
        .result.show { display: block; animation: fade .4s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .status {
            font-size: 2rem;
            font-weight: 800;
        }
        .status.up { color: #34d399; }
        .status.down { color: #f87171; }
        .meta {
            margin-top: 14px;
            display: grid;
            gap: 8px;
            color: #d1d5db;
            font-size: .9rem;
        }
        .error { color: #fbbf24; }
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { color: #9ca3af; font-size: .8rem; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h1>Is it down?</h1>
        <p class="sub">Check if a website is online or offline.</p>
        <div class="row">
            <input id="domain" type="text" placeholder="google.com or https://www.google.com" />
            <button id="checkBtn">Check</button>
        </div>
        <div class="spinner" id="spinner"></div>
        <div class="result" id="result">
            <div class="status" id="status"></div>
            <div class="meta" id="meta"></div>
        </div>
        <p class="hint">Enter domain with or without http://, https://, www — all formats work.</p>
    </div>
    <script>
        const btn = document.getElementById('checkBtn');
        const input = document.getElementById('domain');
        const result = document.getElementById('result');
        const statusEl = document.getElementById('status');
        const metaEl = document.getElementById('meta');
        const spinner = document.getElementById('spinner');

        // Extract domain from any URL format
        function extractDomain(url) {
            if (!url) return '';
            // Remove protocol
            url = url.replace(/^https?:\/\//, '');
            // Remove www
            url = url.replace(/^www\./, '');
            // Remove path, query, hash
            url = url.split(/[/?#]/)[0];
            return url.toLowerCase().trim();
        }

        btn.addEventListener('click', async () => {
            const raw = input.value.trim();
            const domain = extractDomain(raw);
            
            if (!domain || !/^[\w-]+(\.[\w-]+)+$/.test(domain)) {
                alert('Please enter a valid domain, e.g. google.com or https://www.google.com');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = 'Checking<span class="spinner"></span>';
            spinner.style.display = 'inline-block';
            result.classList.remove('show');
            
            // Try direct fetch first (some browsers allow it via CORS), then fallback to proxy
            const endpoints = [
                `https://api.isitdown.org/${domain}`, // Direct (may work in some browsers)
                `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.isitdown.org/' + domain)}` // Proxy
            ];
            
            let success = false;
            for (const endpoint of endpoints) {
                try {
                    const res = await fetch(endpoint, { signal: AbortSignal.timeout(8000) });
                    if (!res.ok) throw new Error('API error ' + res.status);
                    const data = await res.json();
                    const info = Array.isArray(data) ? data[0] : data;
                    const isUp = info.status === 'up';
                    statusEl.textContent = isUp ? '✅ UP' : '❌ DOWN';
                    statusEl.className = 'status ' + (isUp ? 'up' : 'down');
                    const meta = [];
                    if (info.responseTime) meta.push(`Response time: ${info.responseTime}ms`);
                    if (info.error) meta.push(`Error: ${info.error}`);
                    metaEl.innerHTML = meta.length ? meta.join('<br>') : 'No additional details.';
                    result.classList.add('show');
                    success = true;
                    break;
                } catch (e) {
                    // Try next endpoint
                    continue;
                }
            }
            
            if (!success) {
                result.classList.add('show');
                statusEl.textContent = '⚠️ Error';
                statusEl.className = 'status down';
                metaEl.textContent = 'Failed to fetch — the status service may be unreachable. Try again later.';
            }
            
            btn.disabled = false;
            btn.innerHTML = 'Check';
            spinner.style.display = 'none';
        });
        
        // Enter key to check
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
